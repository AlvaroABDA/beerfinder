{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<div class="card">
    <h2>Editar Local: {{ venue.name }}</h2>
    
    <form method="POST" action="{{ url_for('routes.edit_venue', id=venue.id) }}">
        <div style="display: flex; gap: 1rem;">
            <div style="flex:1;">
                <label>Nombre del Bar</label>
                <input type="text" name="name" value="{{ venue.name }}" required>
            </div>
            <div style="flex:1;">
                <label>Ciudad</label>
                <input type="text" name="city" value="{{ venue.city }}" required>
            </div>
        </div>
        
        <label>Dirección</label>
        <input type="text" name="address" value="{{ venue.address }}" required>
        
        <label>Descripción</label>
        <textarea name="description" rows="3">{{ venue.description }}</textarea>
        
        <label>Ubicación (clic en mapa para actualizar)</label>
        <div id="edit-map" style="height: 250px; width: 100%; border-radius: 8px; margin-bottom: 1rem; z-index: 1;"></div>
        
        <div style="display: flex; gap: 1rem; display: none;">
            <input type="text" id="latitude" name="latitude" value="{{ venue.latitude or '' }}">
            <input type="text" id="longitude" name="longitude" value="{{ venue.longitude or '' }}">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn">Guardar Cambios</button>
            <a href="{{ url_for('routes.admin', type='venues') }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>

<script>
    var lat = {{ venue.latitude or 40.416775 }};
    var lng = {{ venue.longitude or -3.703790 }};
    var zoom = {{ 15 if venue.latitude else 13 }};
    
    var map = L.map('edit-map').setView([lat, lng], zoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var marker = {% if venue.latitude %}L.marker([lat, lng]).addTo(map){% else %}null{% endif %};

    map.on('click', function(e) {
        var clickedLat = e.latlng.lat;
        var clickedLng = e.latlng.lng;
        
        document.getElementById('latitude').value = clickedLat;
        document.getElementById('longitude').value = clickedLng;
        
        if (marker) {
            map.removeLayer(marker);
        }
        marker = L.marker([clickedLat, clickedLng]).addTo(map);
    });
</script>
{% endblock %}
