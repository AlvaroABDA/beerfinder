{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<div class="card" style="padding: 0; overflow: hidden; border: none;">
    <div id="map" style="height: 62vh; width: 100%;"></div>
</div>

<div class="card" id="venue-info-card" style="display: none; position: absolute; bottom: 80px; left: 10px; right: 10px; z-index: 1000; box-shadow: 0 -4px 20px rgba(0,0,0,0.45);">
    <div class="card-header">
        <div class="card-img" id="venue-card-icon">🏪</div>
        <div class="card-info">
            <h3 class="card-title" id="venue-name">Nombre Bar</h3>
            <p class="card-subtitle" id="venue-address">📍 Dirección</p>
            <div id="venue-radar-note" style="display:none; margin:0.35rem 0; font-size:0.8rem; color:#FCD34D; font-weight:700;"></div>
            <a href="#" id="venue-link" class="btn" style="margin-top: 0.5rem; padding: 0.5rem;">Ver pizarra</a>
        </div>
        <button onclick="closeVenueCard()" style="background:none; border:none; color:var(--text-secondary); font-size:1.5rem; cursor:pointer; align-self:flex-start;">✕</button>
    </div>
</div>

<script>
    var map = L.map('map').setView([40.416775, -3.703790], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var venues = {{ venues | tojson }};
    var bounds = [];

    var beerIcon = L.divIcon({
        html: '<div style="font-size:20px; background:#161920; border:2px solid #94A3B8; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.45);">🏪</div>',
        className: 'custom-div-icon',
        iconSize: [34, 34],
        iconAnchor: [17, 17]
    });

    var radarIcon = L.divIcon({
        html: '<div style="font-size:20px; background:#F59E0B; border:2px solid #FFFFFF; border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px rgba(245,158,11,0.85);">📡</div>',
        className: 'custom-div-icon',
        iconSize: [38, 38],
        iconAnchor: [19, 19]
    });

    venues.forEach(function(venue) {
        if (venue.latitude && venue.longitude) {
            var hasRadar = venue.radar_beers && venue.radar_beers.length > 0;
            var marker = L.marker([venue.latitude, venue.longitude], {icon: hasRadar ? radarIcon : beerIcon}).addTo(map);
            bounds.push([venue.latitude, venue.longitude]);

            marker.on('click', function() {
                document.getElementById('venue-name').innerText = venue.name;
                document.getElementById('venue-address').innerText = '📍 ' + venue.address + (venue.city ? ', ' + venue.city : '');
                document.getElementById('venue-link').href = '/venue/' + venue.id;
                document.getElementById('venue-card-icon').innerText = hasRadar ? '📡' : '🏪';
                var radarNote = document.getElementById('venue-radar-note');
                if (hasRadar) {
                    radarNote.innerText = '📡 En tu radar aquí: ' + venue.radar_beers.join(', ');
                    radarNote.style.display = 'block';
                } else {
                    radarNote.style.display = 'none';
                }
                document.getElementById('venue-info-card').style.display = 'block';
            });
        }
    });

    if (bounds.length > 0) {
        map.fitBounds(bounds, {padding: [50, 50]});
    }

    function closeVenueCard() {
        document.getElementById('venue-info-card').style.display = 'none';
    }

    window.getAppLocation(
        function(pos) {
            var latlng = [pos.coords.latitude, pos.coords.longitude];
            map.setView(latlng, 15);
            L.marker(latlng).addTo(map).bindPopup("Estás aquí").openPopup();
            if (pos.coords.accuracy) {
                L.circle(latlng, pos.coords.accuracy).addTo(map);
            }
        },
        function(err) {
            console.warn("No se pudo obtener la ubicación para el mapa", err);
        }
    );
</script>
{% endblock %}
