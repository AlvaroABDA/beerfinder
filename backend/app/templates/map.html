{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<div class="card" style="padding: 0; overflow: hidden; border: 1px solid var(--border-color);">
    <div id="map" style="height: 64vh; width: 100%;"></div>
</div>

<div class="card" id="venue-info-card" style="display: none; position: absolute; bottom: 82px; left: 12px; right: 12px; z-index: 1000; box-shadow: 0 -6px 24px rgba(0,0,0,0.38);">
    <div class="card-header">
        <div class="card-img" id="venue-card-icon">{{ icon('store') }}</div>
        <div class="card-info">
            <h3 class="card-title" id="venue-name">Nombre Bar</h3>
            <p class="card-subtitle" style="display:flex; align-items:center; gap:0.3rem;">
                {{ icon('map-pin', 'icon-sm') }} <span id="venue-address">Dirección</span>
            </p>
            <div id="venue-radar-note" class="notice-amber" style="display:none; margin:0.4rem 0; padding:0.45rem 0.7rem; font-size:0.78rem; font-weight:700;"></div>
            <a href="#" id="venue-link" class="btn" style="margin-top: 0.5rem; padding: 0.55rem;">Ver pizarra</a>
        </div>
        <button onclick="closeVenueCard()" class="menu-btn" style="width:32px; height:32px; align-self:flex-start;">{{ icon('x', 'icon-sm') }}</button>
    </div>
</div>

<script>
    var map = L.map('map').setView([40.416775, -3.703790], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var venues = {{ venues | tojson }};
    var bounds = [];

    var beerIcon = L.divIcon({
        html: '<div style="background:#161920; color:#F8FAFC; border:2px solid #94A3B8; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(0,0,0,0.45);">' + lucideSvg('store', 'icon-sm') + '</div>',
        className: 'custom-div-icon',
        iconSize: [36, 36],
        iconAnchor: [18, 18]
    });

    var radarIcon = L.divIcon({
        html: '<div style="background:#E8BC6A; color:#14161E; border:2px solid #FFFFFF; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px rgba(232,188,106,0.85);">' + lucideSvg('radar', 'icon-sm') + '</div>',
        className: 'custom-div-icon',
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    });

    venues.forEach(function(venue) {
        if (venue.latitude && venue.longitude) {
            var hasRadar = venue.radar_beers && venue.radar_beers.length > 0;
            var marker = L.marker([venue.latitude, venue.longitude], {icon: hasRadar ? radarIcon : beerIcon}).addTo(map);
            bounds.push([venue.latitude, venue.longitude]);

            marker.on('click', function() {
                document.getElementById('venue-name').innerText = venue.name;
                document.getElementById('venue-address').innerText = venue.address + (venue.city ? ', ' + venue.city : '');
                document.getElementById('venue-link').href = '/venue/' + venue.id;
                document.getElementById('venue-card-icon').innerHTML = hasRadar ? lucideSvg('radar') : lucideSvg('store');
                var radarNote = document.getElementById('venue-radar-note');
                if (hasRadar) {
                    radarNote.innerHTML = lucideSvg('radar', 'icon-sm') + ' <span>En tu radar aquí: ' + escapeHtml(venue.radar_beers.join(', ')) + '</span>';
                    radarNote.style.display = 'flex';
                } else {
                    radarNote.style.display = 'none';
                }
                document.getElementById('venue-info-card').style.display = 'block';
            });
        }
    });

    if (bounds.length > 0) {
        map.fitBounds(bounds, {padding: [50, 50]});
    }

    function closeVenueCard() {
        document.getElementById('venue-info-card').style.display = 'none';
    }

    window.getAppLocation(
        function(pos) {
            var latlng = [pos.coords.latitude, pos.coords.longitude];
            map.setView(latlng, 15);
            L.marker(latlng).addTo(map).bindPopup("Estás aquí").openPopup();
            if (pos.coords.accuracy) {
                L.circle(latlng, pos.coords.accuracy).addTo(map);
            }
        },
        function(err) {
            console.warn("No se pudo obtener la ubicación para el mapa", err);
        }
    );
</script>
{% endblock %}
